[project]
name = "spectre-mcp"
version = "2.0.4"
description = "The fastest X/Twitter automation for AI agents — no browser, no API keys, no monthly fees."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pranjal Richhariya" },
]
keywords = ["mcp", "twitter", "x", "automation", "scraper", "social-media", "agent", "ai-agent", "model-context-protocol"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Communications",
]
dependencies = [
    "curl-cffi>=0.15.0",
    "fastmcp>=3.4.2",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "twscrape>=0.19.0",
]

[project.urls]
Homepage = "https://github.com/pranrichh/spectre-mcp"
Repository = "https://github.com/pranrichh/spectre-mcp"
Documentation = "https://github.com/pranrichh/spectre-mcp#readme"
Issues = "https://github.com/pranrichh/spectre-mcp/issues"
Changelog = "https://github.com/pranrichh/spectre-mcp/blob/main/CHANGELOG.md"
"Tool reference" = "https://github.com/pranrichh/spectre-mcp/blob/main/docs/tools.md"

[project.scripts]
spectre = "spectre.cli:main"
spectre-mcp = "spectre.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectre"]

# The docs assets are for GitHub/PyPI rendering, not for installs.
[tool.hatch.build.targets.sdist]
include = [
    "src/spectre",
    "tests",
    "tools",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "SKILL.md",
    "LICENSE",
    "pyproject.toml",
]
